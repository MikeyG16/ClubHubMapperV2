    "title": "Health and Safety Policies and Procedures – British Gymnastics Club Hub Resources",
    "contentText": "Skip to content Health and Safety Policies and Procedures Recent Lessons Nutrition The Safeguarding Policy: Nutrition outlines the mandatory points which clubs and coaches must follow to ensure safe practices around nutrition are followed and implemented. Pain, Injury & Illness Gymnastics is a complex sport, and as with many sports, pain, injury, and illness are always a possibility but must be managed carefully to minimise any risks Health and Safety System Health and Safety guidance for your gymnastic clubs Securing your premises for a closure or opening after a closure This guidance shares some useful ideas on what you need to consider when closing or opening back up. Arranging your fire alarm testing and evacuation drills An important part of fire safety in your premises is preparing and practicing for emergencies which includes carrying out regular fire / evacuation drills and fire alarm testing. Coaching Ratios Coach to gymnast ratios are vital to control risks associated with the activities and equipment used in gymnastics. Health and Safety for your Workforce By ensuring that health and safety at an individual level is embedded into club policies and procedures, clubs will be providing a safe and healthy workplace for their coaches and other supporting workers. Risk Assessment Support for Clubs A Risk assessment is a process that identifies potential hazards in an activity, assesses the level of risk and then puts in place safe practices to control that risk. Jewellery and Adornments Whilst respecting the need to wear jewellery and adornments, safety of the individual and those working with them is the overriding factor when participating in gymnastics. Health and Safety preparations for new gymnastics clubs This webcast can help you understand the health and Safety requirements of setting up a new club. Health and Safety in your non-dedicated or shared space This webcast will help you have an understanding of the Health and Safety requirements of your club when using non-dedicated facilities such as a leisure centre or school hall. Young Persons Risk Assessment Understand the Risks associated with young people and how you can ensure the safety and wellbeing of a young person. Health and Safety running or setting up your dedicated space safely Designed to help you understand the health and Safety of requirements of running your premises, and how you can help ensure the safety and wellbeing of your staff and users. Health and Safety Guidance: Coaching Practice The following guidance is part of a suite of documents that should be read and implemented in conjunction with the BG Health & Safety Management System & Guidance Health, Safety and Welfare Guidance – Safe Trips This guidance provides information to support clubs with the planning and management of risks associated the gymnastics trips together with a number of supporting documents Health, Safety and Welfare Guidance – Safe Participation The following guidance is part of a suite of documents that should be read and implemented in conjunction with the British Gymnastics Health & Safety Management System & Guidance Health and Safety Policy for Clubs and Affiliated Organisations British Gymnastics regards the health, safety and welfare of all members to be of paramount importance, which should not be comprised Health and Safety guidance for your gymnastics club The Health and Safety Management Toolkit provides practical health and safety guidance for you, your staff and your volunteers. Fire Safety All clubs and affiliated organisations must be constantly vigilant towards fire. Manual Handling Manual Handling is one of the most important aspects of Health and Safety within a gymnastics club environment. RIDDOR RIDDOR (Reporting Injuries, Diseases and Dangerous Occurrences Regulations 2013) Reporting accidents to British Gymnastics Recording and reporting accidents is important to improve our club safety and protect its members and workforce. Access Expert Health & Safety Support Opus Safety (incorporating Agility Risk & Compliance) are the Health and Safety Partners to British Gymnastics.",

    "title": "Legislation – British Gymnastics Club Hub Resources",
    "contentText": "Take Notes Skip to content Topic Category: Legislation Markel – free legal support for clubs Governance Recruiting new volunteers can seem like a daunting task, and often many clubs do not know where to start. Legal Structure Governance The legal structure of a club is the legal identity of your club in the eyes of the law. Record retention: Information and guidance Governance Records are defined as follows: ‘Information created, received and maintained as evidence and information by an organisation or person, in pursuance of legal obligations or progression that they require.’ Employment Contracts Governance The employment contract is crucial to determine and monitor the relationship between the employer and employee, and outlines the key terms associated with the employment of the employee. Data Protection Governance Data protection laws set out strict rules that apply to clubs. GDPR Toolkit Governance, Toolkit We have created a GDPR Toolkit to help your club comply with the GDPR. It contains useful guidance documents and templates to assist you with GDPR compliance in your club. TheMusicLicence – PPL/PRS Governance In almost all cases, if you play or use music in your gymnastics club or for gymnastic events you will require TheMusicLicence. DBS (Disclosure Barring Service) Governance To protect our members and support safe practise it is a requirement for certain members of our coaching and club communities to hold DBS check. Northern Ireland Clubs AccessNI Governance To protect our members and support safe practice it is a requirement for certain members of our coaching and club communities to hold an AccessNI check. For club support please contact Member Services; Call the Club line 0345 5150680* memberservices@british-gymnastics.org For more information about member benefits visit https://www.british-gymnastics.org/member-benefits Club MembershipMarketing HubCourses Safe and Fair SportInsurancePrivacy Policy Sport Recreation AllianceClub Ma     "title": "Club Development – British Gymnastics Club Hub Resources",
    "contentText": "Skip to content Club Development 100% Complete Last activity on July 20, 2026 3:26 pm Complete Club Development Category Content Advice and guidance for club signage and information to display Having certain certificates and information displayed at your club can be a legal or British Gymnastics requirement, but it can also mean less administrative work responding to member or staff enquiries. View Topic Growing your gymnastics club Planning is an important part of any club at any stage of their journey. View Topic Increasing Programme Provision Increasing the programme you have to offer is a fantastic way to recruit and retain members across a population. View Topic Festival Gymnastics Gain a better understanding of what festival gymnastics is and what opportunities are available within festival gymnastics, both nationally and internationally. View Topic Creating exciting learning opportunities for young leaders at your club Intro To… courses are introductory level courses which introduce Young Leaders to the exciting opportunities within our sport. View Topic Creating interesting gymnastics club timetables The Club Timetabling information is to help you develop a new club timetable or revise and existing timetable. View Topic Rise Gymnastics – Discover Rise Gymnastics Discover is aimed at preschool aged children, from walking to when they begin school. View Topic Rise Gymnastics – Excel Rise Gymnastics Excel is aimed at more advanced recreational gymnasts, or for those who have already progressed through Rise Gymnastics Explore. View Topic Rise Gymnastics – Explore Rise Gymnastics Explore is aimed at school aged recreational gymnasts, who are learning foundation skills. View Topic Rise Gymnastics – Overview Rise Gymnastics is a fun packed programme that provides a progressive journey for gymnasts and forms the foundations of gymnastics. View Topic Expanding your club – Increasing gymnast capacity Expanding a gymnastics club could include many different types of development but will usually necessitate or incur an increase in the number of gymnasts your club accommodates. View Topic Preschool Gymnastics Through exposure to a British Gymnastics Preschool programme, children should develop strength, flexibility, balance, and coordination. View Topic Hiring from abroad post-Brexit What your club needs to know about hiring candidates from abroad after Freedom of Movement ended on 31st December 2020. View Topic 11+ Programmes – Recreational Gymnastics As gymnasts get older their motivations change. Whilst skill development is still important, developing strength, flexibility and fitness and having the opportunity to dance, display and socialise with others has increasing importance for gymnasts aged 11+. View Topic Gathering effective feedback from your members Member feedback is one of the best methods to improve your club operations and let you know how your members are feeling about the work you are doing and the experience they are having with you. View Topic Operating across multiple venues Operating out of multiple venues can help to alleviate some of these issues whilst also supporting you to increase your offer and sessions, generate additional membership income and engage new locations and communities. View Topic Buddle – Sport England Club Matters is the one-stop-shop for clubs of all sizes in England, giving advice on all aspects of running or setting up a club. View Topic Club Development Planning A club development plan will help club directors and managers to grow their clubs and keep track of the direction their club is taking. View Topic Employing Young Workers Many clubs have a workforce that may include children and young workers, and so it is important to know that Children’ & ‘Young Workers’ are defined differently in law, and have different rights and restrictions placed on them regarding what they can do at work. View Topic Holiday Clubs A great way to provide more opportunities for participants can be changing or adding to your programme over the school holidays and run ‘holiday clubs, camps or workshops’. View Topic Facility Toolkit A guide to creating dedicated facilities within your gymnasium. View Topic Embedding club roles It’s important to understand what roles your club may need, who these roles may be carried out by and how they can work together to embed good and safe practice throughout club policies and procedures. View Topic Managing expectations in your club A common cause for parent complaints in clubs is that their gymnast has not received the attention or progression that she or he requires. View Topic Active Partnerships – what do they do and how can they support you? The Active Partnerships work across all sports and physical activities, with a variety of different providers to focus on the needs of their communities. View Topic Succession planning & sourcing coaches for recruitment Succession planning is the process of identifying and training workforce with the aim of filling positions if a current role holder leaves. View Topic Hiring a facility for your gymnastics programme When running a gymnastics programme there are a number of reasons why you may consider hiring a facility. View Topic Code of Conduct View Topic Marketing essentials Here are some of the essential elements to consider when contemplating marketing your club or program. View Topic Vision, Values and Aim The success of a gymnastics club or programme relies on the engagement and satisfaction of its members. View Topic Registration for Sport Support Services This registration type is for people delivering additional sport -related services to British Gymnastics members including choreography, strength, fitness, physiotherapy, sport psychology , nutrition etc. View Topic Quick Fundraising Ideas Recruiting new volunteers can seem like a daunting task, and often many clubs do not know where to start. View Topic Hiring out your facility Hiring out your facility is a great way to generate extra income, and also provide additional opportunities for both your members and your community. View Topic Fundraising Toolkit Read useful fundraising tips and ideas View Topic Successful Communication This document will provide guidance on how to communicate effectively with your team and how to build good and long-lasting relationships with members, customers and your community. View Topic British Gymnastics logos and brand guidelines As a valued club partner, you can benefit from displaying your British Gymnastics membership in your marketing and around your club. View Topic Social Media Account Used in the right way, social media can also provide the perfect opportunity to communicate important information to your members and can help to create a sense of community. View Topic 1 of 2",

    "contentText": "Skip to content People Development 100% Complete Last activity on July 20, 2026 3:09 pm Complete People Development Category Content Education Opportunities Coaching, Instructing and Young Leaders We have a wide range of courses to help people start, develop and progress their knowledge and expertise across all gymnastics disciplines. View Topic Volunteer recognition Volunteer recognition is an acknowledgement of accomplishment, reinforces efforts made and is a sign of appreciation. View Topic Apprenticeship programme The British Gymnastics apprenticeship programme runs in partnership with Bridgewater & Taunton College. View Topic Staff Inductions The impressions made when someone starts work for a new organisation have a lasting impact on how they view their employer, so a welcoming and effective experience is key to making this first impression a positive one. View Topic Recreational Gymnastics Judging Information The Recreational Gymnastics Judging Resource is focused on raising awareness and providing some foundation level judging knowledge for beginners. View Topic IR35 IR35 is also known as ‘the off-payroll working rules’ and ‘the intermediaries legislation’. View Topic Event Volunteering with British Gymnastics Event Volunteering is a great opportunity to be involved in the delivery of major events and competitions, meet new people, and see the event from a unique perspective. View Topic Performance Pathway The Performance Pathway is the National Squad structure that support each discipline. View Topic Online Education Courses Here is some important information your club needs to support learners who enrol and complete online coaching courses. View Topic Video Assessment Submission for Level 1 and 2 coaching courses We have created supporting documents to help learners and clubs to understand the new online assessment process and support learners through a successful assessment video submission. View Topic Positive Coaching: Definitions of success How you measure your success depends upon both your goal orientation and that of your participant’s. What are your reasons for engaging and what are your aims? View Topic Gymnastics Activity Instructor Our new Gymnastics Activity Instructor accreditation is a comprehensive training course which enables instructors to independently deliver fun and safe gymnastics-based physical activity to school-aged children and adults. View Topic Gymnastics Helper Gymnastics Helper is an introductory course aimed at anyone interested in learning more about how to effectively help in a gymnastics session. View Topic Trampoline Helper Trampoline Helper is an introductory course aimed at anyone interested in learning more about how to effectively help in a gymnastics session. View Topic The Post-Apprenticeship Journey This information focuses on what happens at the end of an apprenticeship and aims to help clubs navigate the options available for the apprentice and the club when nearing the end of their programme. View Topic Youth Voice We, as a community, have a moral duty to empower young people to contribute to their own experiences. View Topic The Psychological Contract At its core, the psychological contract is built on the everyday actions and statements made by one party and how they are perceived and interpreted by the other. View Topic Coaching Ratios Coach to gymnast ratios are vital to control risks associated with the activities and equipment used in gymnastics. View Topic Being a good mentor We have developed a self-help guide for all things relating to mentoring. It can be found here. View Topic Education Opportunities Judging We have discipline-specific Judge education courses available to help people develop knowledge and confidence to apply competition rules and judge fairly. View Topic The role of the Level 1 Coach Understand your role as a Level 1 Coach at British Gymnastics. View Topic The role of the Level 2 Coach Understand your role as a Level 2 Coach at British Gymnastics. View Topic Positive Coaching Strategies These strategies will help you to avoid conflict and ensure you make positive decisions and create effective relationships with your participants. View Topic Positive Coaching Our Positive Coaching online course is aimed at Level 2 and above coaches. View Topic Performance Management Performance management is an ongoing process of communication between a manager and an employee that occurs throughout the year. View Topic Safe Progression for Gymnasts We are committed to safeguarding the welfare of all children, young persons, and adults at risk in our sport and our aim is to ensure all who participate in gymnastics have a safe, fun, positive experience and are able to fulfil their potential. View Topic Volunteer Recruitment Recruiting new volunteers can seem like a daunting task, and often many clubs do not know where to start. View Topic Planning for your gymnasts’ goals Good planning is necessary to deliver great gymnastics sessions and will play a vital part in your gymnasts’ success and enjoyment. View Topic",

    "contentText": "Take Notes Skip to content Topic Category: Developing your workforce People Development, Toolkit This Hub has been designed to provide you with all the information you will need for Assistant Foundation & Foundation Coach. Training & Holistic Development Policies and Procedures The Safeguarding Policy: Training & Holistic Development outlines the mandatory points which clubs and coaches must follow to ensure safe practices around training and holistic development are followed and implemented. Our #BeTheChange Campaign is all about promoting a safe and fair gymnastics for all. Performance Management People Development Performance management is an ongoing process of communication between a manager and an employee that occurs throughout the year. The Psychological Contract People Development At its core, the psychological contract is built on the everyday actions and statements made by one party and how they are perceived and interpreted by the other. Youth Voice People Development We, as a community, have a moral duty to empower young people to contribute to their own experiences. The Post-Apprenticeship Journey People Development This information focuses on what happens at the end of an apprenticeship and aims to help clubs navigate the options available for the apprentice and the club when nearing the end of their programme. Gymnast/Parents/Coach Code of Conduct People Development The behaviour of club users will contribute to the overall experience that its members will have when participating in gymnastics in your club. IR35 People Development IR35 is also known as ‘the off-payroll working rules’ and ‘the intermediaries legislation’. Staff Inductions People Development The impressions made when someone starts work for a new organisation have a lasting impact on how they view their employer, so a welcoming and effective experience is key to making this first impression a positive one. For club support please contact Member Services; Call the Clu     "contentText": "Skip to content Welfare and Safe Sport Policies and Procedures Recent Lessons National Welfare Officer Conference 2023 Watch some of the guest speakers talk about: Safeguarding Policies & Resources, Learning & Development for Club Welfare Officers, Safe Sport Campaign and Role of the Club Welfare Officer Hydration The Safe Sport: Hydration Policy outlines the mandatory points which clubs and coaches must follow to ensure safe practices around hydration are followed and implemented Academic Education The Safeguarding Policy: Academic Education outlines the mandatory points which clubs and coaches must follow around gymnasts and school attendance British Gymnastics Equality Policy British Gymnastics (BG) subscribes to the principles of equality of opportunity and aims to ensure that anyone involved or wishing to be involved in gymnastics is able to do so in a discrimination-free environment. Becoming a British Gymnastics Welfare Officer The roles and responsibilities of a Club Welfare Officer (CWO). Safeguarding certification in your club Part of a coach annual registration with British Gymnastics includes holding a current Safeguarding certificate. Embedding Safeguarding into everyday practice checklist This checklist is to ensure that safeguarding is embedded into everyday practice in your club. It provides useful ideas for improvement which can be supported by the welfare officer/officers. Welfare Officer Toolkit The welfare/safeguarding officer toolkit has been designed to support you in your role and ensure safeguarding is embedded in all aspects of the sport at your club. British Gymnastics Complaints Policy The policy sets out the procedures for making complaints about British Gymnastics, and how these complaints will be handled Equality and diversity Equality, diversity and inclusion are critical to the success of all organisations. Being committed to equal opportunities for all means that we can provide the best service for our customers.     "contentText": "Take Notes Skip to content Toolkits and Guides Assistant Foundation & Foundation Coach Hub Complete Topic Progress 100% Complete Assistant Foundation & Foundation Coach Hub This Hub has been designed to provide you with all the information you will need for Assistant Foundation & Foundation Coach.The Assistant Foundation & Foundation Coach courses have been designed based on feedback from the community, with the aim being to make becoming a coach more accessible. Some of the key features include:Reduced time and cost to qualifyEnable coaches to broaden their capabilities by delivering across a wide breadth of skillsRemove the previous requirement to repeat learning and assessmentProvide more choice and opportunitiesProvide more authentic learning and assessment experiences. Click here to access the Hub Useful links Foundations of Gymnastics Coaching Foundations of Gymnastics Coaching is an online course for anyone 16-years or above looking to start their coaching journey. Click to enrol here Delivering Gymnastics Activities Delivering Gymnastics Activities is an exciting, blended course with online learning and a 3-day in-person practical. It is for anyone aged 16 or above who wants to become an Assistant Coach, who already holds Foundations of Gymnastics Coaching. Click to enrol here Leading Gymnastics Sessions Leading Gymnastics Sessions is an online course for anyone 18-years or above looking to take on the role of independent delivery and Lead Coach. Click to enrol here Independent Delivery Assessment The Independent Delivery Assessment is for anyone 18-years or over who has completed Leading Gymnastics Sessions and is ready to start their assessment. Click to enrol here Assessing Independent Delivery The Assessing Independent Delivery Information Hub is for coaches in our community who will be conducting the Foundation Coach Independent Delivery Assessments. Click to enrol here Effective Coach Mentoring Effective Coach Mentoring is designed itish Gymnastics approach to the use of criminal record checks View Topic Health and Safety Guidance: Coaching Practice The following guidance is part of a suite of documents that should be read and implemented in conjunction with the BG Health & Safety Management System & Guidance View Topic Health and Safety Policy for Clubs and Affiliated Organisations British Gymnastics regards the health, safety and welfare of all members to be of paramount importance, which should not be comprised View Topic Health, Safety and Welfare Guidance – Safe Participation The following guidance is part of a suite of documents that should be read and implemented in conjunction with the British Gymnastics Health & Safety Management System & Guidance View Topic Health, Safety and Welfare Guidance – Safe Trips This guidance provides information to support clubs with the planning and management of risks associated the gymnastics trips together with a number of supporting documents View Topic Advertising on Clothing & Competition Attire at Events Policy This policy sets out the rules that are applied at events organised by British Gymnastics to the Advertising and branding that is permissible on the Clothing, Competition Attire and Personal Equipment View Topic Anti-Doping Policy & Procedure British Gymnastics believes that all gymnastics activity should be undertaken without the use of substances that can be harmful to the wellbeing of gymnasts View Topic British Gymnastics Complaints Policy The policy sets out the procedures for making complaints about British Gymnastics, and how these complaints will be handled View Topic British Gymnastics Equality Policy British Gymnastics (BG) subscribes to the principles of equality of opportunity and aims to ensure that anyone involved or wishing to be involved in gymnastics is able to do so in a discrimination-free environment. View Topic Competition Attire At Events for Gymnasts Policy This policy sets out the overarching principles and rules that are applied at British Gymnastics Events with regards to Gymnasts competition attire View Topic Prevention of Manipulation of Competitions Policy British Gymnastics, as a sports organisation bound by the Olympic Charter and the IOC Code of Ethics declares our commitment to support the integrity of sport. View Topic Technical Regulations A British Gymnastics policy on Technical Regulations View Topic",

    "id": 35,
    "title": "Weighing Gymnasts – British Gymnastics Club Hub Resources",
    "contentText": "Take Notes Skip to content Policies and Procedures Weighing Gymnasts Complete Weighing Gymnasts The Safe Sport: Weighing Policy outlines the mandatory points which clubs and coaches must follow to ensure safe practices around weighing gymnasts are followed and implemented.These policies supersede our previous policies and position statements. We are currently in the process of reviewing all policies and consulting with members of the community to update them. If you are unsure of anything regarding safeguarding please contact welfareandsafesport@british-gymnastics.org and for any other queries you can contact our customer support team on 0345 1297129 View policy What does my club need to do for all new policies? Ensure you understand the specific points and how you currently implement these practices. See where you can enhance your practices using the relevant good practices resources. Ensure your club members, including parents/carers are educated on how you are implementing this policy and good practices? – Have a look at the What do I need to know resources for gymnasts and parents/carers below. Ensure any club standard operating procedures and codes of conduct are aligned to the policy. Share and promote your good practices amongst the community & learn from others. Ensure your coaches, staff, welfare officer and volunteers understand how they must implement the policy. Encourage everyone within your club to raise any queries if they are not sure or feel uncomfortable on a practice or comment they implemented, experienced or observed. Weighing Gymnasts policy video View now Weighing Gymnasts: Good Practice Guide View now Weighing Gymnasts: Key Policy Points View now Weighing Gymnasts: Sport Science / Medicine Practitioners Key Policy Points View now Weighing Gymnasts: What Do I Need To Know View now Weighing Gymnasts: Parents / Carers Key Policy Points View now Frequently asked questions What is a ‘performance’ reason for weighing a gymnast?This list is not exhaustive but contains some examples of how weight data can be combined with other measures for performance reasons:– For some strength and conditioning based exercises, practitioners may need to understand relative values to work out things such as % body weight.– For some performance tests on a force plate, such as jump-based tests, it is useful to understand relative measures to understand things such as relative force (W/kg). What can I do as a Club Welfare Officer?The sport science or medicine practitioner should notify the club welfare officer of any gymnasts who consent to be weighed. Gymnasts and parents/carers should know how to contact the club welfare officer if they want to ask any questions or are unsure about anything. What is Khamis-Roche method?The Khamis-Roche method (Khamis & Roche, 1994) can be used to calculate percentage predicated adult height (%PAH) to ascertain maturation status. Gymnast’s growth spurt status can be defined using %PAH (Pre: <85%, Circa: 85–96%, Post: 96%<), (Parr et al., 2020; Sanders et al., 2017; Khamis & Roche, 1994).Predicated Adult Height = βo + stature* β1 + body mass*(β2) + corrected mid-parent stature*β3Note: βo, β1, β2, and β3 are the gender specific intercept and coefficients by which age, stature (in), body mass (lbs) and mid-parent stature (in) respectively should be multiplied from the coefficients table available in Khamis & Roche (1994). Correction factor for self-reported height in males is (Parental Height [cm]*0.955) + 2.316).Gymnasts should be flagged as at risk if they fall between 85-96% of predicted adult height. Gymnasts are encouraged to communicate with their coach if they have any joint, back pain or tightness of muscles.ReferencesParr, J., Winwood, K., Hodson-Tole, E., Deconinck, F. J. A., Parry, L., Hill, J. P., Malina, R. M., & Cumming, S. P. (2020). Predicting the timing of the peak of the pubertal growth spurt in elite youth soccer players: Evaluation of methods. Annals of Human Biology, 0(ja), 1–23.https://doi.org/10.1080/03014460.2020.1782989Khamis, H. J., & Roche, A. F. (1994). Predicting Adult Stature Without Using Skeletal Age: The Khamis-Roche Method. Pediatrics, 94(4), 504–507.Sanders, J. O., Qiu, X., Lu, X., Duren, D. L., Liu, R. W., Dang, D., Menendez, M. E., Hans, S. D., Weber, D. R., & Cooperman, D. R. (2017). The Uniform Pattern of Growth and Skeletal Maturation during the Human Adolescent Growth Spurt. Sci Rep, 7(1), 1–10. https://doi.org/10.1038/s41598-017-16996-w Where can I find more details about the Support Staff registration?Link to support staff registration page on membership (https://www.british-gymnastics.org/memberships) Why can’t coaches weigh gymnasts?We have reviewed the reasons for coaches weighing gymnasts, we do not consider any significant advantages or information gained from weighing gymnasts other than by a qualified sport science or medicine practitioner. Why hasn’t weighing been banned completely?For scientifically valid reasons and in a safe manner, weighing a gymnast can have benefits for both health and performance reasons which are detailed in the policy. It is important to remember that it is always the gymnasts choice whether they are weighed are not, and this must only be done with the gymnast’s optimal long term development in mind. Identifying when gymnasts are in the growth spurt is important as gymnasts are at greater risk of injury during this period, specifically greater risk of growth-related injuries. In addition, weighing gymnasts can have benefits for performance reasons. This could be for strength and conditioning reasons, which has many benefits for gymnasts and their development. Using weight in combination with performance measures allows individuals such as strength and conditioning practitioners to assess relative performance measures and safely programme specific exercises. What should I include in a written consent form?Informed consent is the process of voluntary agreement by a fully informed competent person to participate in the proposed activity. Gymnasts and parents/carers (in the case of minors) must be given sufficient information to allow them to decide whether or not they want to be weighed. A consent form should be a short document written in lay language containing explicit statements. The advantage of a written consent form is that you as a sport science or medicine practitioner and the gymnast and their parent/carer (in the case of minors) have a record of all the relevant information about weighing. This written consent form must be completed annually if a gymnast is to be weighed, and should be seen as supplementary to an initial conversation with a gymnast and their parent/carer (in the case of minors) around weighing. Details which should be included:Name of the gymnastThe reason why the weight data is being taken in combination with another measureWhat will happen to the data – How will it be stored?Gymnast & Parent/carer (in the case of minors) signatureAn example of good practice is to share a copy of this form with the club welfare officer. Gymnasts and parents/carers should contact their club welfare officer if they have any questions or concerns around weighing. Why can gymnasts be weighed from 10 years of age?Gymnasts from the age of 10 may undergo growth and maturation changes. Measuring a gymnasts growth spurt is important to understand when gymnasts may be at greater risk of injury (circa-growth spurt). If using the Khamis-Roche (1994) method, if a gymnast is circa-growth spurt (85-96% predicted adult height) it is important to consider:– Modifying and adapting training– Don’t be afraid to regress and go back to basic skills or drills– Supplementary physical preparation work– Landings and use of different surfaces– Placing more emphasis on the maintenance of flexibility rather than improvementGymnasts should always be encouraged to communicate with their coach if they have any joint, back pain or tightness of muscles. As a coach, what if I’ve got a health, performance or injury concern about a gymnast?Where there are health, performance, or injury concerns regarding weight and/or body composition, clubs and coaches should liaise with parents/carers and seek advice from appropriately qualified practitioners, for example GPs, nutritionists, physiotherapists etc. Latest policies Policies and Procedures Disciplinary Regulations Complete Disciplinary Regulations Club Development, Governance, Policies and Procedures Previous Topic Back to Category Next Topic Policies and Procedures Safeguarding Regulations Complete Safeguarding Regulations Club Development, Governance, Policies and Procedures Previous Topic Back to Category Next Topic Policies and Procedures Position of Trust Guidance Complete Position of Trust Guidance Club Development, Governance, Policies and Procedures A British Gymnastics safeguarding policy for those in a position of trust. Previous Topic Back to Category Next Topic Policies and Procedures Weighing Gymnasts Complete Was this topic helpful? For club support please contact Member Services; Call the Club line 0345 5150680* memberservices@british-gymnastics.org For more information about member benefits visit https://www.british-gymnastics.org/member-benefits Club MembershipMarketing HubCourses Safe and Fair SportInsurancePrivacy Policy Sport Recreation AllianceBuddleLogout Our funding partners Previous Topic Back to Category Next Topic Previous Topic Back to Category Next Topic Take Notes Policies and Procedures Weighing Gymnasts Complete Previous Topic Back to Category Next Topic Notifications",

    "contentText": "Take Notes Skip to content Policies and Procedures Academic Education Complete Academic Education The Safeguarding Policy: Academic Education outlines the mandatory points which clubs and coaches must follow around gymnasts and school attendance. These policies supersede our previous policies and position statements. We are currently in the process of reviewing all policies and consulting with members of the community to update them. If you are unsure of anything regarding safeguarding please contact welfareandsafesport@british-gymnastics.org and for any other queries you can contact our customer support team on 0345 1297129 View policy What does my club need to do for all new policies? Ensure you understand the specific points and how you currently implement these practices. See where you can enhance your practices using the relevant good practices resources. Ensure your club members, including parents/carers are educated on how you are implementing this policy and good practices? – Have a look at the What do I need to know resources for gymnasts and parents/carers below. Ensure any club standard operating procedures and codes of conduct are aligned to the policy. Share and promote your good practices amongst the community & learn from others. Ensure your coaches, staff, welfare officer and volunteers understand how they must implement the policy. Encourage everyone within your club to raise any queries if they are not sure or feel uncomfortable on a practice or comment they implemented, experienced or observed. Academic Education video View now Academic Education: Good Practice Guide View now Academic Education: Key Policy Points View now Academic Education: Gymnasts What do I need to know? View now Academic Education: Parents/Carers What do I need to know? View now Frequently asked questions Do British Gymnastics put on National squad activity during formal education (i.e., school time)?Where possible British Gymnastics aims to minimise the amount of formal education time missed through National squad activity and British Gymnastics events. During National squads, British Gymnastics offers a curriculum which aims to develop the gymnasts holistically. Whereby gymnasts may miss a school day to attend a National squad, a study session is planned into the camp schedule with gymnasts encouraged to bring any school work. Our Club provides sessions for schools during the day as part of the school curriculum, will these sessions be affected by the policy?The Safeguarding Policy: Academic Education refers to children missing formal education time for gymnastics club training. School sessions whereby a class of children attend a gymnastics club or venue as part of their school curriculum is not affected by the policy. Why can’t children under the age of 12 miss formal education for gymnastics club training?British Gymnastics does not believe it is necessary for any child to miss formal education in pursuit of their gymnastics goals. British Gymnastics also believes that children can fulfil all of their gymnastics training without missing any formal education, especially gymnasts under the age of 12. Under this age, British Gymnastics also believes there is no ‘performance’ reason or justification as to why a child should miss formal education for gymnastics club training. Even over the age of 12, the decision for a child to miss any formal education for gymnastics club training must not be taken without following the process detailed in the Safeguarding Policy: Academic Education, and any child missing any formal education for gymnastics club training must not compromise their academic education. What is an exceptional circumstance?It is not possible to define what an exceptional circumstance is as it is ultimately what is right for the individual outside and inside of gymnastics. When considering whether a gymnast should come out of school, think about what impact this will have on the individual’s education and development (social and emotional), is it necessary or are there alternative times they could train outside of school hours, and is there full support for the decision from the education provider, gymnast, parent/carer, club and coach(es). Can a gymnast still miss school for ‘one-off’ type events such as competitions? As defined in page 4 of the Safeguarding Policy: Academic Education, this document refers to children missing regular school or formal education for gymnastics club training. The policy does not cover children missing ‘one-off’ type events such as competitions. It is at the discretion of the school or formal education providers as to whether they authorise an absence for ‘one-off type’ events. Where possible, British Gymnastics aims to schedule events such as competitions outside of formal education hours. Our Club provides sessions for home education children during the daytime, will these sessions be affected by the policy?For any child, regardless of whether they are home or school educated, it is important to remember that any gymnastics activity must not compromise a child’s academic education. The Safeguarding Policy: Academic Education states that gymnastics sessions must not be scheduled during formal education time for gymnastics under the age of 12. Home Education differs from that of the school curriculum, therefore home educated children may not engage with a traditional curriculum with ‘academic’ activity occurring during the daytime. Where Home Educated children may partake in recreational gymnastics activity at a club registered with British Gymnastics, this can provide many benefits such as developing basic movement patterns, engaging in social activity and improving physical literacy to supplement their home education. Some home educated children may also attend gymnastics sessions in the evening.In addition, it is important that clubs offer fair and equal opportunities to children of all educational backgrounds (i.e., sessions that are offered to home educated children during the daytime, similar sessions and opportunities should be offered to school educated children outside of academic time). What can I do as a club welfare officer?Although the club welfare officer is not directly involved in the agreement form process for children missing formal education for gymnastics club training. It is good practice for club welfare officers to be notified of any gymnasts who are missing formal education for gymnastics club training. Club welfare officers should also assist to uphold the Safeguarding: Academic Education Policy within their club. Gymnasts and parents/carers should know how to contact the club welfare officer if they want to ask any questions or are unsure about anything. Why hasn’t missing formal education for gymnastics club training been banned completely?Schools have the authority to arrange or agree for pupils to undertake part of their education outside school premises, if this meets the requirements set out in regulation 6(4)(a) of the Education (Pupil Registration) (England) Regulations 2006. The Regulations require that an approved educational activity which takes place outside school premises must be approved by the school, be of an educational nature, including sporting activities, and be supervised by someone authorised by the school. The activity must take place during the session for which it is recorded. The regulations can be found here: https://www.legislation.gov.uk/uksi/2006/1751/contents/madeThe benefits of any educational activity must be carefully weighed against what will be lost by the individual pupil in terms of attendance at school. Where a school does approve an educational activity, the school can determine how frequently the activity takes place. Schools are responsible for the safeguarding and welfare of pupils who are educated off site and should take this into account when making decisions regarding arrangements for pupils to receive education outside school premises.British Gymnastics recognises there may be exceptional circumstances where a child may miss some formal education for gymnastics club training. All stakeholders must be in full agreement as per the Safeguarding Policy: Academic Education. What is the enforcement period for this policy?There is no enforcement period as such, as we understand this policy may require changes to business models, standard operating procedures and stakeholder expectations. However, clubs must align to the policy as soon as possible and be able to demonstrate their process in doing so. If you need any support through your transition period, please do not hesitate to contact us. Latest policies Policies and Procedures Disciplinary Regulations Complete Disciplinary Regulations Club Development, Governance, Policies and Procedures Previous Topic Back to Category Next Topic Policies and Procedures Safeguarding Regulations Complete Safeguarding Regulations Club Development, Governance, Policies and Procedures Previous Topic Back to Category Next Topic Policies and Procedures Position of Trust Guidance Complete Position of Trust Guidance Club Development, Governance, Policies and Procedures A British Gymnastics safeguarding policy for those in a position of trust. Previous Topic Back to Category Next Topic Policies and Procedures Academic Education Complete Was this topic helpful? For club support please contact Member Services; Call the Club line 0345 5150680* memberservices@british-gymnastics.org For more information about member benefits visit https://www.british-gymnastics.org/member-benefits Club MembershipMarketing HubCourses Safe and Fair SportInsurancePrivacy Policy Sport Recreation AllianceBuddleLogout Our funding partners Previous Topic Back to Category Next Topic Previous Topic Back to Category Next Topic Take Notes Policies and Procedures Academic Education Complete Previous Topic Back to Category Next Topic Notifications",

    "title": "Nutrition – British Gymnastics Club Hub Resources",
    "contentText": "Take Notes Skip to content Nutrition Policies and Procedures Nutrition Complete Nutrition The Safeguarding Policy: Nutrition outlines the mandatory points which clubs and coaches must follow to ensure safe practices around nutrition are followed and implemented. These polices supersede our previous policies and position statements. We are currently in the process of reviewing all policies and consulting with members of the community to update them. If you are unsure of anything regarding safeguarding please contact welfareandsafesport@british-gymnastics.org and for any other queries you can contact our customer support team on 0345 1297129 View policy What does my club need to do for all new policies? Ensure you understand the specific points and how you currently implement these practices. See where you can enhance your practices using the relevant good practices resources. Ensure your club members, including parents/carers are educated on how you are implementing this policy and good practices? – Have a look at the What do I need to know resources for gymnasts and parents/carers below. Ensure any club standard operating procedures and codes of conduct are aligned to the policy. Share and promote your good practices amongst the community & learn from others. Ensure your coaches, staff, welfare officer and volunteers understand how they must implement the policy. Encourage everyone within your club to raise any queries if they are not sure or feel uncomfortable on a practice or comment they implemented, experienced or observed. Nutrition policy video Nutrition: Good Practice Guide View now Nutrition: Key Policy Points View now Gymnasts- Nutrition Poster View now Parent/Carers – Nutrition Poster View now Nutrition Recipe Cards View now Frequently asked questions Do clubs need to provide snacks?Clubs do not need to provide snacks, however they must ensure opportunities for gymnasts to have a snack as and when required by the gymnast. If I am a qualified nutritionist and coach, can I provide bespoke, nutritional advice to gymnasts in my club?Coaches with dual roles are not permitted to provide bespoke individualised nutrition advice to gymnasts or their parents/carers in the same club as per the policy due to their coaching role. This is to create boundaries with areas that have been identified as sensitive. What if my venue health& safety policy doesn’t allow for food in the venue?Communicate and work with the venue provider to explain the requirements of the policy. Discuss information such as types of food, when this may be required, solutions on where this break could happen, planned provision of any supervision, how you will ensure the area is clear after use. You could also share any rules that you may have e.g., no nuts/ no fizzy drinks by the apparatus etc. Does this policy apply to recreational gymnasts?Yes, this policy applies to all gymnasts regardless of level. We're here to support It's ok to make a mistake or ask for help. We're here to support you. Our Welfare and Safe Sport team are on hand to answer your questions and help everybody in gymnastics have an enjoyable, safe and uplifting experience. Get in touch Report a concern If you have a concern relating to the behaviour of someone within gymnastics and would like to discuss this, you can contact the Welfare and Safe Sport team by calling 0345 1297129 or by emailing welfareandsafesport@british-gymnastics.org Online form Latest information Policies and Procedures Disciplinary Regulations Complete Disciplinary Regulations Club Development, Governance, Policies and Procedures Previous Topic Back to Category Next Topic Policies and Procedures Safeguarding Regulations Complete Safeguarding Regulations Club Development, Governance, Policies and Procedures Previous Topic Back to Category Next Topic Policies and Procedures Position of Trust Guidance Complete Position of Trust Guidance Club Development, Governance, Policies and Procedures A British Gy     "contentText": "Take Notes Skip to content Policies and Procedures Pain, Injury & Illness Complete Pain, Injury & Illness Gymnastics is a complex sport, and as with many sports, pain, injury, and illness are always a possibility but must be managed carefully to minimise any risks. Pain is highly individual and needs to be managed sensitively and collaboratively between the gymnast, parent/carer, coach and, where appropriate, wider support team.These policies supersede our previous policies and position statements. We are currently in the process of reviewing all policies and consulting with members of the community to update them. If you are unsure of anything regarding safeguarding please contact welfareandsafesport@british-gymnastics.org and for any other queries you can contact our customer support team on 0345 1297129 View policy What does my club need to do for all new policies? Ensure you understand the specific points and how you currently implement these practices. See where you can enhance your practices using the relevant good practices resources. Ensure your club members, including parents/carers are educated on how you are implementing this policy and good practices? – Have a look at the What do I need to know resources for gymnasts and parents/carers below. Ensure any club standard operating procedures and codes of conduct are aligned to the policy. Share and promote your good practices amongst the community & learn from others. Ensure your coaches, staff, welfare officer and volunteers understand how they must implement the policy. Encourage everyone within your club to raise any queries if they are not sure or feel uncomfortable on a practice or comment they implemented, experienced or observed. Pain, Injury & Illness policy video View now Pain, Injury & illness - Key policy points View now Pain, Injury & illness – Good practice guide View now Gymnasts poster - Pain, Injury & illness View now Parent/Carers poster - Pain, Injury & illness View now Concussion - Key Guidance View now Concussion- How to respond View now Concussion- How to recognise View now Frequently asked questions Pain, Injury & Illness Who has the final decision?If one person believes that the gymnast is unable to fully or partially train, this must be the decision which is taken. All other decisions around pain, injury and illness must be made collaboratively and this must be reviewed regularly. Why is medical advice not final?As in the phrase, medical advice is advice. However, any medical advice must be respected and taken into consideration when making any decisions around training. The only exception is when there is an appointed medical officer at competitions, where the medical officers decision is final. Concussion Am I eligible for the enhanced pathway?Only gymnasts who are over the age of 16 and are fully funded on the World Class Programme might be eligible to follow the Enhanced Care pathway. Everyone else must follow the UK Concussion guidelines for grassroot sports. Pain, Injury and Illness Policy Webcast Latest policies Policies and Procedures Disciplinary Regulations Complete Disciplinary Regulations Club Development, Governance, Policies and Procedures Previous Topic Back to Category Next Topic Policies and Procedures Safeguarding Regulations Complete Safeguarding Regulations Club Development, Governance, Policies and Procedures Previous Topic Back to Category Next Topic Policies and Procedures Position of Trust Guidance Complete Position of Trust Guidance Club Development, Governance, Policies and Procedures A British Gymnastics safeguarding policy for those in a position of trust. Previous Topic Back to Category Next Topic Policies and Procedures Pain, Injury & Illness Complete Was this topic helpful? For club support please contact Member Services; Call the Club line 0345 5150680* memberservices@british-gymnastics.org For more information about member benefits visit https://www.british-gymnastics.org/member-benefits Club
